version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    # Paused until after the 1 September 2026 launch: weekly PRs were
    # generating red CI runs and mail noise during the final push.
    # open-pull-requests-limit: 0 stops new PRs outright; schedule is turned
    # down to monthly as a second layer for whenever the limit is raised
    # again. Re-enable both (interval: "weekly", limit back to the default)
    # once the post-launch dependency pass is scheduled — see ASSETS-TODO.md.
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    groups:
      patch-and-minor:
        update-types:
          - "patch"
          - "minor"
    # Major upgrades (typescript, eslint, jest-axe, @types/node as of
    # 2026-08-16) land as noisy, high-risk PRs right before the 1 September
    # launch. Ignored until after launch — remove this once the post-launch
    # major-upgrade pass is scheduled.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
