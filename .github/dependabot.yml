version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      patch-and-minor:
        update-types:
          - "patch"
          - "minor"
    # Major upgrades still land as noisy, high-risk PRs (typescript, eslint,
    # jest-axe, @types/node as of 2026-08-16) that deserve a deliberate,
    # scheduled pass rather than an unattended auto-PR — ignored on an
    # ongoing basis, not tied to the 1 September 2026 launch date anymore.
    # Run a major-upgrade pass manually every so often instead.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
